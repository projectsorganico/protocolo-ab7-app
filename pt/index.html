let speechRoute='',speechChunks=[],speechIndex=0,speechState='idle',speechGeneration=0,speechCurrent=null,speechMessage='';
const speechAvailable=()=>('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window);
const speedLabel=()=>String(readingSpeed).replace('.',',')+'×';
function audioControls(){return `<div class="audio-controls" aria-label="Leitura em voz alta"><button class="btn secondary" data-audio-start ${speechAvailable()?'':'disabled'}>${icon('speaker')} Ouvir módulo</button><button class="btn secondary" data-audio-pause disabled>Pausar</button><button class="btn secondary" data-audio-stop disabled>Parar</button><button class="btn secondary audio-speed" data-audio-speed aria-label="Velocidade de leitura: ${speedLabel()}. Toque para alterar.">${speedLabel()}</button><p class="audio-status" id="audio-status" role="status">${speechAvailable()?'':'A leitura em voz alta não está disponível neste navegador.'}</p></div>`}
function updateAudioControls(){const running=speechRoute===location.hash&&['playing','paused'].includes(speechState);const start=document.querySelector('[data-audio-start]'),pause=document.querySelector('[data-audio-pause]'),stop=document.querySelector('[data-audio-stop]'),speed=document.querySelector('[data-audio-speed]'),status=document.querySelector('#audio-status');if(start)start.disabled=!speechAvailable()||speechState==='loading';if(pause){pause.disabled=!running;pause.textContent=speechState==='paused'?'Continuar':'Pausar'}if(stop)stop.disabled=!running;if(speed){speed.textContent=speedLabel();speed.setAttribute('aria-label','Velocidade de leitura: '+speedLabel()+'. Toque para alterar.')}if(status&&speechAvailable())status.textContent=speechMessage||(speechState==='loading'?'Buscando uma voz feminina em português…':speechState==='paused'?'Leitura pausada.':'');if(running&&speechChunks[speechIndex])highlightSegment(speechChunks[speechIndex].segment,false)}
function clearReadingHighlight(){document.querySelectorAll('.reading-current').forEach(n=>{n.classList.remove('reading-current');n.removeAttribute('aria-current')})}
function highlightSegment(index,scroll=true){clearReadingHighlight();const node=document.querySelector('[data-reading-segment="'+index+'"]');if(!node)return;node.classList.add('reading-current');node.setAttribute('aria-current','true');if(scroll){const bar=document.querySelector('.audio-controls'),rect=node.getBoundingClientRect(),top=(bar?.getBoundingClientRect().bottom||0)+18;if(rect.top<top||rect.top>innerHeight-100){const y=scrollY+rect.top-top;window.scrollTo({top:Math.max(0,y),behavior:'smooth'})}}}
function stopReading(){speechGeneration++;if(speechAvailable())speechSynthesis.cancel();speechRoute='';speechChunks=[];speechState='idle';speechCurrent=null;speechMessage='';clearReadingHighlight();updateAudioControls()}
function voiceRank(v){const lang=v.lang.toLowerCase().replace('_','-');const score=lang==='pt-br'?0:lang.startsWith('pt')?1:100;return score*10+(v.localService?0:1)}
function feminineVoice(v){const name=v.name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();return /\b(luciana|vitoria|vitória|fernanda|thalita|francisca|raquel|google portugues do brasil|paulina|sabina|monica|mia|lucia|laura|dalia|elena|helena|paloma|isabella|isabel|maria|catalina|camila|valeria|clara|francisca|antonia|lupe|female|femenina|mujer)\b/.test(name)}
function portugueseVoice(){return speechSynthesis.getVoices().filter(v=>/^pt(?:[-_]|$)/i.test(v.lang)&&feminineVoice(v)).sort((a,b)=>voiceRank(a)-voiceRank(b))[0]||null}
async function waitForPortugueseVoice(){let voice=portugueseVoice();if(voice)return voice;return new Promise(resolve=>{let timer;const done=()=>{const found=portugueseVoice();if(found){clearTimeout(timer);speechSynthesis.removeEventListener?.('voiceschanged',done);resolve(found)}};speechSynthesis.addEventListener?.('voiceschanged',done);timer=setTimeout(()=>{speechSynthesis.removeEventListener?.('voiceschanged',done);resolve(portugueseVoice())},1200)})}
function prepareSpeech(){const article=document.querySelector('.article'),title=document.querySelector('.reader-head h1');if(!article||!title)return [];const candidates=[title,...article.querySelectorAll('h2,h3,p,li,.notice,.sources')];const segments=candidates.filter(n=>!n.parentElement.closest('li,.notice,.sources'));let prefix='';const chunks=[];let segment=0;for(const node of segments){let text=node.textContent.replace(/\s+/g,' ').trim();if(!text)continue;if(/^\d+[.]$/.test(text)){prefix='Passo '+text.replace('.','')+'. ';continue;}if(node.tagName==='LI'&&node.parentElement.tagName==='OL'){const siblings=[...node.parentElement.children].filter(n=>n.tagName==='LI');text='Passo '+((Number(node.parentElement.getAttribute('start'))||1)+siblings.indexOf(node))+'. '+text;}else if(node.tagName==='P'){text=text.replace(/(?:^|\s)(\d+)\.\s+(?=[A-ZÁÉÍÓÚÑ])/g,(_,number)=>' Passo '+number+'. ')}text=prefix+text;prefix='';node.dataset.readingSegment=segment;let chunk='';for(const word of text.split(' ')){if(chunk.length+word.length>220&&chunk){chunks.push({text:chunk.trim(),segment});chunk=''}chunk+=word+' '}if(chunk)chunks.push({text:chunk.trim(),segment});segment++;}return chunks}
function speakNext(generation,voice){if(!voice){stopReading();speechMessage='Nenhuma voz feminina em português foi encontrada.';updateAudioControls();return}if(generation!==speechGeneration||speechState==='idle')return;if(speechIndex>=speechChunks.length){stopReading();return}const item=speechChunks[speechIndex],utterance=new SpeechSynthesisUtterance(item.text);utterance.voice=voice;utterance.lang=voice.lang;utterance.rate=readingSpeed;utterance.onstart=()=>{if(generation===speechGeneration)highlightSegment(item.segment)};utterance.onboundary=()=>{if(generation===speechGeneration)highlightSegment(item.segment,false)};utterance.onend=()=>{if(generation!==speechGeneration)return;speechIndex++;speechCurrent=null;if(speechState!=='paused')speakNext(generation,voice)};utterance.onerror=e=>{if(generation!==speechGeneration||e.error==='canceled'||e.error==='interrupted')return;stopReading();speechMessage='Não foi possível reproduzir a voz. Confira as vozes instaladas e tente novamente.';updateAudioControls()};speechCurrent=utterance;highlightSegment(item.segment);speechSynthesis.speak(utterance)}
async function startReading(){if(!speechAvailable())return;stopReading();speechRoute=location.hash;speechState='loading';const generation=speechGeneration;updateAudioControls();const voice=await waitForPortugueseVoice();if(generation!==speechGeneration||speechRoute!==location.hash)return;if(!voice){stopReading();speechMessage='Nenhuma voz feminina em português foi encontrada no seu dispositivo. Adicione uma voz feminina em português nas configurações de idioma ou acessibilidade e tente novamente.';updateAudioControls();return}speechChunks=prepareSpeech();speechIndex=0;speechState='playing';speechMessage='';updateAudioControls();speakNext(generation,voice)}
document.querySelector('#main').addEventListener('click',e=>{if(e.target.closest('[data-audio-start]'))void startReading();if(e.target.closest('[data-audio-stop]'))stopReading();if(e.target.closest('[data-audio-pause]')){if(speechState==='paused'){speechState='playing';speechSynthesis.resume();if(!speechCurrent)speakNext(speechGeneration,portugueseVoice())}else{speechState='paused';speechSynthesis.pause()}updateAudioControls()}if(e.target.closest('[data-audio-speed]')){readingSpeed=READING_SPEEDS[(READING_SPEEDS.indexOf(readingSpeed)+1)%READING_SPEEDS.length];try{localStorage.setItem('ab7-reading-speed',String(readingSpeed))}catch{}if(speechState==='playing'){speechGeneration++;speechSynthesis.cancel();speechCurrent=null;speakNext(speechGeneration,portugueseVoice())}updateAudioControls()}});

function bonus(){const id=(location.hash||'').split('/')[1];const material=bonusMaterials.find(b=>b.id===id);if(material)return `<div class="reader"><a class="back" href="#bonus">← Todos os conteúdos exclusivos</a><div class="reader-head"><span class="module-caption">CONTEÚDO EXCLUSIVO</span><h1>${esc(material.title)}</h1><p>${esc(material.description)}</p></div>${audioControls()}<article class="article"><figure class="lesson-visual"><img src="${String(material.image).replace(/\.png$/,'.webp')}" alt="Cuidados de saúde bucal"></figure>${material.article}${sourceBox}</article><div class="reader-bottom">${btn('Voltar aos conteúdos exclusivos','#bonus','secondary')}</div></div>`;return `${heading('Seus conteúdos exclusivos','Cada complemento é ativado com a compra correspondente.')}<div class="bonus-grid">${BONUS_CATALOG.map(b=>{const owned=bonusMaterials.find(m=>m.id===b.id);return `<section class="panel bonus-card"><figure class="lesson-visual"><img src="${b.image}" alt="Cuidados de saúde bucal" loading="lazy"></figure><div class="bonus-content"><span class="module-caption">CONTEÚDO EXCLUSIVO</span><h2>${esc(b.title)}</h2><p class="bonus-access-state">${icon(owned?'shield':'lock')}${owned?'Acesso ativo':'Acesso bloqueado'}</p><p>${owned?'Seu complemento está disponível para consultar e ouvir no aplicativo.':'Este conteúdo é ativado somente com a compra deste complemento.'}</p>${owned?btn('Ver conteúdo','#bonus/'+b.id):`<div class="bonus-buy-actions"><a class="btn" data-bonus-checkout="${b.id}" href="${b.checkout || '#perfil'}" target="_blank" rel="noopener noreferrer">Comprar este conteúdo ${icon('arrow')}</a><button class="btn secondary" data-bonus-refresh>Já comprei · verificar acesso</button></div><p class="muted bonus-checkout-note">Compre com o mesmo e-mail que usa para entrar no aplicativo. O acesso é ativado após a aprovação do pagamento.</p>`}</div></section>`}).join('')}</div>`}

function applyTheme(){document.body.classList.toggle('dark',state.theme==='dark');document.querySelector('#theme').innerHTML=icon(state.theme==='dark'?'sun':'moon');document.querySelector('#avatar').textContent=(state.name||'T')[0].toUpperCase()}
function render(scroll=true){if(!entryAccepted){applyTheme();return}if(speechRoute&&speechRoute!==location.hash)stopReading();const route=(location.hash||'#inicio').slice(1).split('/');let page=route[0];if(!programAccess&&!['premium','perfil','bonus'].includes(page)){page=premiumContent?'premium':'bonus';history.replaceState(null,'',location.pathname+location.search+'#'+page)}document.body.classList.toggle('bonus-page',page==='bonus');document.body.classList.toggle('premium-page',page==='premium');const active=page==='modulo'?'modulos':page;const moduleId=Number(route[1]);if(page==='modulo'&&modules.some(m=>m.id===moduleId)&&state.lastModule!==moduleId){state.lastModule=moduleId;save()}const visibleNavs=programAccess?navs:navs.filter(n=>['premium','perfil'].includes(n[0])||(n[0]==='bonus'&&bonusMaterials.length));document.documentElement.style.setProperty('--nav-count',visibleNavs.length);for(const id of ['desktop-nav','mobile-nav'])document.querySelector('#'+id).innerHTML=visibleNavs.map(([key,label,ic])=>`<a class="nav-link ${key===active?'active':''}" ${key===active?'aria-current="page"':''} href="#${key}">${icon(ic)}<span>${label}</span></a>`).join('');document.querySelector('#main').innerHTML=({inicio:home,modulos:moduleList,rutina:routine,progreso:progress,perfil:profile,bonus:bonus,premium}[page]||(()=>reader(Number(route[1]))))();applyTheme();if(speechRoute===location.hash&&speechState!=='idle')prepareSpeech();updateAudioControls();if(scroll)window.scrollTo({top:0,behavior:'instant'})}
document.querySelector('#theme').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';save();applyTheme();const select=document.querySelector('#theme-select');if(select)select.value=state.theme};
document.querySelector('#main').addEventListener('change',e=>{if(e.target.matches('[data-task]')){let day=e.target.dataset.date;if(day>today())return;state.tasks[day]||=[];state.tasks[day][Number(e.target.dataset.task)]=e.target.checked;save();render(false)}});
document.querySelector('#main').addEventListener('submit',e=>{if(e.target.id==='profile-form'){e.preventDefault();state.name=document.querySelector('#name').value.trim().slice(0,40);state.theme=document.querySelector('#theme-select').value;save();render(false);toast('Seu perfil foi atualizado.')}});
document.querySelector('#main').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.complete){const id=Number(b.dataset.complete);state.completed=state.completed.includes(id)?state.completed.filter(n=>n!==id):[...state.completed,id];save();render(false);toast(state.completed.includes(id)?'Mais um passo na sua jornada.':'Módulo marcado como pendente.')}if(b.dataset.day){selectedDay=b.dataset.day;render(false)}});

let installPrompt=null;
const INSTALL_STATE_KEY='ab7-install-state-v2';
let installState={installed:false,postponements:0,nextPromptAt:0};
try{const saved=JSON.parse(localStorage.getItem(INSTALL_STATE_KEY)||'{}');installState={installed:saved.installed===true,postponements:Number.isInteger(saved.postponements)&&saved.postponements>=0?saved.postponements:0,nextPromptAt:Number.isFinite(saved.nextPromptAt)?saved.nextPromptAt:0}}catch{}
const standaloneApp=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const installedApp=()=>standaloneApp()||installState.installed;
const iosDevice=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const androidDevice=()=>/Android/i.test(navigator.userAgent);
const androidChrome=()=>androidDevice()&&/Chrome\//i.test(navigator.userAgent)&&!/SamsungBrowser|EdgA|OPR|Firefox|; wv\)/i.test(navigator.userAgent);
function saveInstallState(){try{localStorage.setItem(INSTALL_STATE_KEY,JSON.stringify(installState))}catch{}}

const installDialog=document.createElement('dialog');installDialog.id='install-dialog';installDialog.setAttribute('aria-labelledby','install-title');installDialog.innerHTML=`<button class="icon-btn install-close" data-install-later aria-label="Fechar e lembrar mais tarde">${icon('close')}</button><div class="install-dialog-head"><span class="install-brand-mark"><img alt="" aria-hidden="true"></span><div><h2 id="install-title">Instale seu programa como aplicativo</h2><p>Abra com um toque pela tela inicial, em tela cheia e sem a barra do navegador.</p></div></div><div id="install-instructions"></div><div class="install-dialog-actions"><button class="btn" data-install-native hidden>Instalar app</button><button class="btn" data-install-understood>Entendido</button><button class="install-later" data-install-later>Agora não</button></div>`;installDialog.querySelector('.install-brand-mark img').src=document.querySelector('.ab7-reference-base').src;document.body.append(installDialog);
function showInstallHint(){if(installedApp())return;const direct=androidChrome()&&!!installPrompt;installDialog.dataset.installMode=direct?'native':iosDevice()?'ios':androidDevice()?'android':'desktop';document.querySelector('#install-instructions').innerHTML=direct?`<p class="install-direct-copy">Toque em <strong>«Instalar app»</strong> para abrir a janela de instalação do Chrome. Confirme e o aplicativo ficará na sua tela inicial.</p>`:iosDevice()?`<ol class="install-steps"><li><span>Toque no botão <strong>Compartilhar</strong> ${icon('share')} en la barra de Safari.</span></li><li><span>Role pelas opções e escolha <strong>«Adicionar à Tela de Início»</strong>.</span></li><li><span>Toque em <strong>«Adicionar»</strong>, no canto superior direito.</span></li></ol><p class="install-browser-note">Se a opção não aparecer, abra este link no Safari.</p>`:androidDevice()?`<ol class="install-steps"><li><span>Abra o menu <strong>⋮</strong>, no canto superior direito do navegador.</span></li><li><span>Escolha <strong>«Instalar app»</strong> ou <strong>«Adicionar à Tela de Início»</strong>.</span></li><li><span>Toque em <strong>«Instalar»</strong> ou <strong>«Adicionar»</strong> para confirmar.</span></li></ol><p class="install-browser-note">Se a opção não aparecer, abra este link no Chrome.</p>`:`<ol class="install-steps"><li><span>Abra o menu do navegador ou procure o ícone de instalação na barra de endereços.</span></li><li><span>Selecione <strong>«Instalar Halitus AB7»</strong> ou <strong>«Instalar aplicativo»</strong>.</span></li><li><span>Confirme para abrir o programa pela área de trabalho.</span></li></ol><p class="install-browser-note">Se seu navegador não oferecer essa opção, use Chrome ou Edge.</p>`;document.querySelector('[data-install-native]').hidden=!direct;document.querySelector('[data-install-understood]').hidden=direct;installDialog.querySelector('.install-dialog-actions [data-install-later]').hidden=!direct;if(!installDialog.open)installDialog.showModal()}
function postponeInstallHint(){installState.postponements++;installState.nextPromptAt=Date.now()+(installState.postponements>=3?10:1)*24*60*60*1000;saveInstallState();if(installDialog.open)installDialog.close()}
function markInstalled(){installState.installed=true;installState.nextPromptAt=0;saveInstallState();installPrompt=null;if(installDialog.open)installDialog.close();document.querySelectorAll('[data-install-help]').forEach(button=>{button.disabled=true;if(button.classList.contains('header-install')){button.setAttribute('aria-label','Aplicativo instalado');button.innerHTML=icon('phone')+'<span>Instalado</span>'}else button.innerHTML=icon('phone')+' Aplicativo instalado'})}
installDialog.addEventListener('click',async e=>{if(e.target.closest('[data-install-later],[data-install-understood]'))postponeInstallHint();if(e.target.closest('[data-install-native]')&&androidChrome()&&installPrompt){const prompt=installPrompt;installPrompt=null;try{await prompt.prompt();const choice=await prompt.userChoice;if(choice.outcome==='accepted')markInstalled();else postponeInstallHint()}catch{showInstallHint();toast('Abra o menu do navegador e selecione «Instalar app».')}}});
installDialog.addEventListener('cancel',e=>{e.preventDefault();postponeInstallHint()});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;if(installDialog.open)showInstallHint()});
window.addEventListener('appinstalled',markInstalled);
document.addEventListener('click',e=>{if(e.target.closest('[data-install-help]'))showInstallHint()});if(installedApp()){const b=document.querySelector('.header-install');b.disabled=true;b.setAttribute('aria-label','Aplicativo instalado');b.innerHTML=icon('phone')+'<span>Instalado</span>'}
if((iosDevice()||androidDevice())&&!installedApp()&&Date.now()>=installState.nextPromptAt)setTimeout(()=>{if(!installedApp()&&Date.now()>=installState.nextPromptAt)showInstallHint()},3500);

let premiumState=emptyPremiumState(),premiumTimer=null,premiumDirty=false,premiumSaveChain=Promise.resolve(),premiumDay=null;
function cleanPremiumProgress(data){const out=emptyPremiumState(),ids=premiumContent?.lessons.map(l=>l.id)||[];if(!data||typeof data!=='object'||Array.isArray(data))return out;if(/^\d{4}-\d{2}-\d{2}$/.test(data.start||'')&&data.start<=today())out.start=data.start;if(ids.includes(data.lastLesson))out.lastLesson=data.lastLesson;if(Array.isArray(data.completed))out.completed=[...new Set(data.completed.filter(id=>ids.includes(id)))];if(data.tasks&&typeof data.tasks==='object'&&!Array.isArray(data.tasks))for(const[day,a]of Object.entries(data.tasks))if(/^\d{4}-\d{2}-\d{2}$/.test(day)&&day<=today()&&Array.isArray(a))out.tasks[day]=Array.from({length:7},(_,i)=>a[i]===true);if(typeof data.profile?.name==='string')out.profile.name=data.profile.name.slice(0,40);if(['light','dark'].includes(data.profile?.theme))out.profile.theme=data.profile.theme;return out}
function savePremium(){if(!entryAccepted||!authUser||!premiumContent)return;premiumDirty=true;clearTimeout(premiumTimer);premiumTimer=setTimeout(flushPremium,500)}
function flushPremium(){clearTimeout(premiumTimer);if(!premiumDirty||!authUser||!premiumContent)return premiumSaveChain;premiumDirty=false;const userId=authUser.id,snapshot=JSON.parse(JSON.stringify(premiumState));premiumSaveChain=premiumSaveChain.then(async()=>{const{error}=await authClient.from('ab7_premium_progress').upsert({user_id:userId,data:snapshot,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(authUser?.id!==userId)return;if(error){premiumDirty=true;toast('Não foi possível salvar seu progresso premium. Confira sua conexão.')}}).catch(()=>{if(authUser?.id===userId){premiumDirty=true;toast('Não foi possível salvar seu progresso premium.')}});return premiumSaveChain}

 const lessonId=(location.hash||'').split('/')[1],lesson=premiumContent.lessons.find(l=>l.id===lessonId);if(lesson)return premiumReader(lesson);

async function recheckAccess(){if(!entryAccepted||!authUser)return;const {data,error}=await authClient.from('ab7_content').select('id');if(error)throw new Error('access_check_failed');if(!data?.length){clearBuyer('Seu acesso não está ativo. Fale com o suporte.');return}const hasBase=data.some(c=>c.id==='program'),hasPremium=data.some(c=>c.id==='adaptacion');const expectedBonuses=BONUS_CATALOG.filter(b=>data.some(c=>c.id===b.scope)).map(b=>b.id).sort().join(','),currentBonuses=bonusMaterials.map(b=>b.id).sort().join(',');if(hasBase!==programAccess||hasPremium!==!!premiumContent||expectedBonuses!==currentBonuses){if(!hasBase){clearTimeout(progressTimer);progressDirty=false}if(!hasPremium){clearTimeout(premiumTimer);premiumDirty=false;premiumContent=null}stopReading();bonusMaterials=bonusMaterials.filter(b=>BONUS_CATALOG.some(c=>c.id===b.id&&data.some(d=>d.id===c.scope)));document.querySelector('#main').replaceChildren();await Promise.all([flushProgress(),flushPremium(),flushBuyerPreferences()]);await bootstrapBuyer()}}
setInterval(()=>recheckAccess().catch(()=>{}),300000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')recheckAccess().catch(()=>{});else if(entryAccepted){flushProgress();flushPremium();flushBuyerPreferences()}});
updateEntry();applyTheme();bootstrapBuyer();

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('./sw.js').catch(()=>{});
const modelContext=document.modelContext;
if(modelContext?.registerTool){
 const lifecycle=new AbortController();
 const tools=[{
 name:'read_ab7_progress',title:'Ler progresso AB7',description:'Ler módulos concluídos e registros diários do dispositivo.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},execute(){if(!entryAccepted)throw Error('Entre na sua conta');return {completed:[...state.completed],tasks:JSON.parse(JSON.stringify(state.tasks)),lastModule:state.lastModule}}
 },{
 name:'open_ab7_module',title:'Abrir módulo AB7',description:'Abrir um dos sete módulos originais e salvar o ponto de continuação.',inputSchema:{type:'object',properties:{id:{type:'integer',minimum:1,maximum:7}},required:['id'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(input){if(!entryAccepted)throw Error('Entre na sua conta');if(!input||Object.keys(input).some(k=>k!=='id')||!Number.isInteger(input.id)||input.id<1||input.id>7)throw Error('Módulo inválido');location.hash='modulo/'+input.id;render();return {module:input.id,title:modules[input.id-1].title}}
 }];
 for(const tool of tools){try{Promise.resolve(modelContext.registerTool(tool,{signal:lifecycle.signal})).catch(()=>{})}catch{}}
 addEventListener('pagehide',()=>lifecycle.abort(),{once:true});
}
</script></body></html>
