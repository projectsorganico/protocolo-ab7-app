function tasks(day=today()){return `<div>${taskLabels.map((t,i)=>`<label class="task"><input type="checkbox" data-task="${i}" data-date="${day}" ${(state.tasks[day]||[])[i]?'checked':''} ${day>today()?'disabled':''}><span>${t}</span><span class="task-icon">${i===0?'AM':i===3?'PM':'DIARIO'}</span></label>`).join('')}</div>`}
function stats(){return `<div class="stats"><div class="stat">${icon('book')}<div><strong>${state.completed.length}<span class="muted"> / 7</span></strong><small>Módulos completados</small></div></div><div class="stat">${icon('check')}<div><strong>${countTasks(today())}<span class="muted"> / 4</span></strong><small>Cuidados de hoy</small></div></div><div class="stat">${icon('chart')}<div><strong>${pct()}%</strong><small>Avance de aprendizaje</small></div></div></div>`}
function resumeModule(){const last=modules.find(m=>m.id===state.lastModule);return (last&&!state.completed.includes(last.id)?last:null)||modules.find(m=>!state.completed.includes(m.id))||last||modules[0];}
function home(){const next=resumeModule();const started=state.lastModule!==null||state.completed.length>0;return `${heading(`Bienvenido de nuevo${state.name?', '+esc(state.name):''}!`,'Qué bueno tenerte aquí. Dedica un momento a cuidarte.')}<p class="sync-status" id="sync-status" role="status">✓ Progreso guardado en tu cuenta</p><section class="hero"><div class="hero-copy"><div class="eyebrow"><span class="pill-dot"></span> BIENVENIDO A TU NUEVO COMIENZO</div><h2>Tu cuidado empieza<br>con un <em>pequeño hábito.</em></h2><p>Aprende, organiza tu rutina y avanza a tu ritmo.<br>Todo tu programa, en un solo lugar.</p>${btn(started?'Continuar donde lo dejaste':'Comenzar mi programa','#modulo/'+next.id)}</div><div class="hero-image" aria-hidden="true"></div></section>${stats()}<div class="two-col"><section><div class="section-title"><h2>${state.completed.length===7?'Vuelve a tu programa':started?'Continuar donde lo dejaste':'Tu primer paso'}</h2><a class="text-link" href="#modulos">Ver módulos ↗</a></div><div class="panel resume-panel"><div class="continue-card">${modArt(next)}<div><span class="module-caption">MÓDULO 0${next.id} · CONTENIDO</span><h3>${next.title}</h3><p>${next.description}</p><a class="text-link" href="#modulo/${next.id}">${started?'Retomar módulo':'Comenzar módulo'} →</a></div></div><div class="progress-meta"><span>Tu recorrido de aprendizaje</span><span>${pct()}%</span></div><div class="meter"><span style="width:${pct()}%"></span></div></div></section><section><div class="section-title"><h2>Un momento para ti</h2><span class="today-tag">HOY</span></div><div class="panel">${tasks()}</div></section></div><div class="quote home-quote"><p><strong>“Cada pequeño hábito es una forma de cuidarte.”</strong></p><span>AVANZA A TU RITMO</span><p class="audience-note">Aplicación de uso exclusivo para personas que sufren de mal aliento.</p></div>`}
function moduleList(){return `${heading('Tu programa','Siete pasos para entender y mejorar tus hábitos de cuidado.')}<div class="intro-banner">${icon('book')}<span>Empieza por la bienvenida y avanza en orden. Todos los módulos están disponibles para consultar cuando quieras.</span></div><div class="grid">${modules.map(m=>`<a class="module-card" href="#modulo/${m.id}">${modArt(m)}<div class="content"><span class="module-caption">MÓDULO 0${m.id}</span><h3>${m.title}</h3><p>${m.description}</p><div class="card-bottom"><span>${state.completed.includes(m.id)?'✓ Completado':'Ver contenido'}</span><span>↗</span></div></div></a>`).join('')}</div>`}
function reader(id){const m=modules.find(m=>m.id===id);if(!m)return '<div class="empty">Módulo no encontrado. <a href="#modulos">Volver al programa</a></div>';return `<div class="reader"><a class="back" href="#modulos">← Todos los módulos</a><div class="reader-head"><span class="module-caption">MÓDULO 0${id} DE 07</span><h1>${m.title}</h1><p>${m.description}</p></div>${audioControls()}<article class="article"><figure class="lesson-visual"><img src="./assets/modulo-${id}.webp" alt="${moduleImageAlts[id-1]}" decoding="async"></figure>${articles[id-1]}${sourceBox}</article>${moduleNudge(id)}<div class="reader-bottom"><button class="btn ${state.completed.includes(id)?'secondary':''}" data-complete="${id}">${state.completed.includes(id)?'✓ Completado · desmarcar':'Marcar como completado'}</button>${id<7?btn('Siguiente módulo','#modulo/'+(id+1),'secondary'):btn('Ver mi progreso','#progreso','secondary')}</div></div>`}

function routine(){return `${heading('Tu rutina diaria','Un espacio para organizar tus cuidados, sin prisas.')}<div class="intro-banner">${icon('leaf')}<span>Este recorrido de 11 días es un registro de hábitos, no un plazo de curación. Puedes seguir usando el checklist después de completar el recorrido.</span></div><div class="section-title"><h2>Tu recorrido</h2><button class="btn secondary small" data-day="${today()}">Volver a hoy</button></div><div class="days">${Array.from({length:11},(_,i)=>{const d=dateOffset(i);return `<button class="day ${d===selectedDay?'today':''} ${countTasks(d)===4?'done':''}" data-day="${d}" aria-pressed="${d===selectedDay}"><small>DÍA</small>${String(i+1).padStart(2,'0')}<small>${countTasks(d)===4?'✓':d.slice(8)+'/'+d.slice(5,7)}</small></button>`}).join('')}</div><p class="muted">Registro seleccionado: ${new Date(selectedDay+'T12:00:00').toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'})}</p><div class="routine-grid"><div class="panel"><div class="section-title"><h2>Checklist de cuidados</h2><span class="today-tag">${countTasks(selectedDay)} / 4</span></div>${selectedDay>today()?'<p class="muted">Este día aún no ha llegado. Podrás registrar tus cuidados cuando llegue la fecha.</p>':''}${tasks(selectedDay)}<p class="muted">Después de cepillarte con pasta fluorada, escupe el exceso y no enjuagues inmediatamente con agua.</p></div><div class="panel"><h2>Recetas del material</h2><a class="recipe-preview" href="#modulo/6">${icon('cup')}<div><h3>Infusión de jengibre y menta</h3><p>Ingredientes y preparación · bebida caliente</p></div><span>↗</span></a><a class="recipe-preview" href="#modulo/6">${icon('water')}<div><h3>Té verde, menta e hinojo</h3><p>Ingredientes y preparación · bebida fría</p></div><span>↗</span></a><p class="muted">Recetas culinarias del programa. Consulta las notas de cuidado antes de prepararlas.</p></div></div>${sourceBox}`}
function progress(){const recorded=Object.values(state.tasks).filter(a=>Array.isArray(a)&&a.some(Boolean)).length;const total=Object.values(state.tasks).reduce((s,a)=>s+(Array.isArray(a)?a.filter(Boolean).length:0),0);return `${heading('Cada paso cuenta','Aquí puedes ver todo lo que ya has recorrido.')}${stats()}<div class="two-col"><div class="panel"><h2>Tu aprendizaje</h2><div class="ring" style="--p:${pct()}%"><div><strong>${pct()}%</strong><small>DEL PROGRAMA</small></div></div>${modules.map(m=>`<a href="#modulo/${m.id}" class="completed-row"><span class="status-dot ${state.completed.includes(m.id)?'done':''}">${state.completed.includes(m.id)?'✓':m.id}</span><span>${m.title}</span><span style="margin-left:auto">↗</span></a>`).join('')}</div><div><div class="panel"><h2>Tus hábitos en números</h2><p style="font-size:35px;font-family:Manrope;margin:15px 0 3px">${total}</p><p class="muted">cuidados registrados en ${recorded} ${recorded===1?'día':'días'}</p><div class="notice">Tu progreso refleja lecturas y tareas registradas. No mide el estado de tu salud ni los resultados de un tratamiento.</div>${btn('Ir a mi rutina','#rutina','secondary')}</div><div class="quote"><p>Lo importante es encontrar una rutina que puedas mantener.</p></div></div></div>`}
function bonus(){const id=bonusRouteId();const material=bonusMaterials.find(b=>b.id===id);const catalogItem=BONUS_CATALOG.find(b=>b.id===id);if(!material&&catalogItem&&BONUS_SALES[id])return bonusSales(catalogItem);if(material)return `<div class="reader"><a class="back" href="#bonus">← Todos los contenidos exclusivos</a><div class="reader-head"><span class="module-caption">CONTENIDO EXCLUSIVO</span><h1>${esc(material.title)}</h1><p>${esc(material.description)}</p></div>${audioControls()}<article class="article"><figure class="lesson-visual"><img src="${String(material.image).replace(/\.png$/,'.webp')}" alt="Cuidados de salud bucal"></figure>${material.article}${sourceBox}</article><div class="reader-bottom">${btn('Volver a contenidos exclusivos','#bonus','secondary')}</div></div>`;return `${heading('Tus contenidos exclusivos','Cada complemento se activa con su compra correspondiente.')}<div class="bonus-grid">${BONUS_CATALOG.map(b=>{const owned=bonusMaterials.find(m=>m.id===b.id);return `<section class="panel bonus-card"><figure class="lesson-visual"><a href="#bonus/${b.id}" aria-label="${esc(b.title)}"><img src="${b.image}" alt="Cuidados de salud bucal" loading="lazy"></a></figure><div class="bonus-content"><span class="module-caption">CONTENIDO EXCLUSIVO</span><h2>${esc(b.title)}</h2><p class="bonus-access-state">${icon(owned?'shield':'lock')}${owned?'Acceso activo':'Acceso bloqueado'}</p><p>${owned?'Tu complemento está disponible para consultar y escuchar dentro del app.':'Este contenido se activa únicamente con la compra de este complemento.'}</p>${owned||!BONUS_SALES[b.id]?'':`<a class="bonus-more" href="#bonus/${b.id}"><span><strong>Ver qué incluye</strong><small>Capítulos, un consejo gratis y test de 30 segundos</small></span>${icon('arrow')}</a>`}${owned?btn('Ver contenido','#bonus/'+b.id):`<div class="bonus-buy-actions"><a class="btn" data-bonus-checkout="${b.id}" href="${b.checkout}" target="_blank" rel="noopener noreferrer">Comprar este contenido ${icon(' function profile(){return `<div class="profile-intro"><div class="avatar">${esc((state.name||'T')[0].toUpperCase())}</div><div><h1>Bienvenido${state.name?', '+esc(state.name):''}!</h1><p class="access-active">${icon('shield')} ¡Tu acceso está activo!</p></div></div><section class="panel support-panel"><div class="support-heading">${icon('user')}<div><h2>Soporte dedicado</h2><p>¿Necesitas ayuda con el protocolo? Habla con nuestro equipo.</p></div></div><div class="support-actions"><a class="btn secondary" href="mailto:${SUPPORT_CONTACTS.email}?subject=Ayuda%20con%20Halitus%20AB7">${icon('mail')} Contactar por correo electrónico</a><a class="btn" href="https://wa.me/${SUPPORT_CONTACTS.whatsapp}?text=${encodeURIComponent('¡Hola! Necesito ayuda con Halitus AB7.')}" target="_blank" rel="noopener">${icon('message')} Contactar por WhatsApp</a></div></section><div class="profile-grid"><section class="panel"><h2>Mi perfil</h2><form id="profile-form"><label class="field">¿Cómo te llamas?<input id="name" name="name" maxlength="40" placeholder="Tu nombre" value="${esc(state.name)}" autocomplete="given-name"></label><label class="field">Apariencia<select id="theme-select" name="theme"><option value="light" ${state.theme==='light'?'selected':''}>Tema claro</option><option value="dark" ${state.theme==='dark'?'selected':''}>Tema oscuro</option></select></label><button class="btn" type="submit">Guardar cambios</button><button class="btn secondary" type="button" data-exit style="margin-top:12px">Salir del app</button></form><p class="muted">${storageOK?'Tu nombre y tu progreso se guardan en tu cuenta.':'No se pudo guardar. Revisa tu conexión.'}</p></section></div>`}
function applyTheme(){document.body.classList.toggle('dark',state.theme==='dark');document.querySelector('#theme').innerHTML=icon(state.theme==='dark'?'sun':'moon');document.querySelector('#avatar').textContent=(state.name||'T')[0].toUpperCase()}
function render(scroll=true){if(!entryAccepted){applyTheme();return}if(speechRoute&&speechRoute!==location.hash)stopReading();const route=(location.hash||'#inicio').slice(1).split('/');let page=route[0];if(page==='lucia'&&!aiAccess)page=programAccess?'inicio':'perfil';if(!programAccess&&!['premium','perfil','bonus','lucia'].includes(page)){page=premiumContent?'premium':'bonus';history.replaceState(null,'',location.pathname+location.search+'#'+page)}document.body.classList.toggle('bonus-page',page==='bonus');document.body.classList.toggle('premium-page',page==='premium');const active=page==='modulo'?'modulos':page;const moduleId=Number(route[1]);if(page==='modulo'&&modules.some(m=>m.id===moduleId)&&state.lastModule!==moduleId){state.lastModule=moduleId;save()}const visibleNavs=(programAccess?navs:navs.filter(n=>['premium','perfil','lucia'].includes(n[0])||(n[0]==='bonus'&&bonusMaterials.length))).filter(n=>n[0]!=='lucia'||aiAccess);document.documentElement.style.setProperty('--nav-count',visibleNavs.length);for(const id of ['desktop-nav','mobile-nav'])document.querySelector('#'+id).innerHTML=visibleNavs.map(([key,label,ic])=>`<a class="nav-link ${key===active?'active':''}" ${key===active?'aria-current="page"':''} href="#${key}">${icon(ic)}<span>${label}</span></a>`).join('');document.querySelector('#main').innerHTML=({inicio:home,lucia:lucia,modulos:moduleList,rutina:routine,progreso:progress,perfil:profile,bonus:bonus,premium}[page]||(()=>reader(Number(route[1]))))();applyTheme();if(speechRoute===location.hash&&speechState!=='idle')prepareSpeech();updateAudioControls();if(scroll)window.scrollTo({top:0,behavior:'instant'})}
document.querySelector('#theme').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';save();applyTheme();const select=document.querySelector('#theme-select');if(select)select.value=state.theme};
document.querySelector('#main').addEventListener('change',e=>{if(e.target.matches('[data-task]')){let day=e.target.dataset.date;if(day>today())return;state.tasks[day]||=[];state.tasks[day][Number(e.target.dataset.task)]=e.target.checked;save();render(false)}});
document.querySelector('#main').addEventListener('submit',e=>{if(e.target.id==='profile-form'){e.preventDefault();state.name=document.querySelector('#name').value.trim().slice(0,40);state.theme=document.querySelector('#theme-select').value;save();render(false);toast('Tu perfil está actualizado.')}});
document.querySelector('#main').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.complete){const id=Number(b.dataset.complete);state.completed=state.completed.includes(id)?state.completed.filter(n=>n!==id):[...state.completed,id];save();render(false);toast(state.completed.includes(id)?'Un paso más en tu recorrido.':'Módulo marcado como pendiente.')}if(b.dataset.day){selectedDay=b.dataset.day;render(false)}});

let installPrompt=null;
const INSTALL_STATE_KEY='ab7-install-state-v2';
let installState={installed:false,postponements:0,nextPromptAt:0};
try{const saved=JSON.parse(localStorage.getItem(INSTALL_STATE_KEY)||'{}');installState={installed:saved.installed===true,postponements:Number.isInteger(saved.postponements)&&saved.postponements>=0?saved.postponements:0,nextPromptAt:Number.isFinite(saved.nextPromptAt)?saved.nextPromptAt:0}}catch{}
const standaloneApp=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const installedApp=()=>standaloneApp()||installState.installed;
const iosDevice=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const androidDevice=()=>/Android/i.test(navigator.userAgent);
const androidChrome=()=>androidDevice()&&/Chrome\//i.test(navigator.userAgent)&&!/SamsungBrowser|EdgA|OPR|Firefox|; wv\)/i.test(navigator.userAgent);
function saveInstallState(){try{localStorage.setItem(INSTALL_STATE_KEY,JSON.stringify(installState))}catch{}}
if(standaloneApp()){installState.installed=true;saveInstallState()}
const installDialog=document.createElement('dialog');installDialog.id='install-dialog';installDialog.setAttribute('aria-labelledby','install-title');installDialog.innerHTML=`<button class="icon-btn install-close" data-install-later aria-label="Cerrar y recordarme más tarde">${icon('close')}</button><div class="install-dialog-head"><span class="install-brand-mark"><img alt="" aria-hidden="true"></span><div><h2 id="install-title">Instala tu programa como una app</h2><p>Ábrelo con un toque desde tu pantalla de inicio, a pantalla completa y sin la barra del navegador.</p></div></div><div id="install-instructions"></div><div class="install-dialog-actions"><button class="btn" data-install-native hidden>Instalar app</button><button class="btn" data-install-understood>Entendido</button><button class="install-later" data-install-later>Ahora no</button></div>`;installDialog.querySelector('.install-brand-mark img').src=document.querySelector('.ab7-reference-base').src;document.body.append(installDialog);
function showInstallHint(){if(installedApp())return;const direct=androidChrome()&&!!installPrompt;installDialog.dataset.installMode=direct?'native':iosDevice()?'ios':androidDevice()?'android':'desktop';document.querySelector('#install-instructions').innerHTML=direct?`<p class="install-direct-copy">Toca <strong>«Instalar app»</strong> para abrir la ventana de instalación de Chrome. Confirma y tendrás el app en tu pantalla de inicio.</p>`:iosDevice()?`<ol class="install-steps"><li><span>Toca el botón <strong>Compartir</strong> ${icon('share')} en la barra de Safari.</span></li><li><span>Desplázate por las opciones y elige <strong>«Añadir a pantalla de inicio»</strong>.</span></li><li><span>Toca <strong>«Añadir»</strong>, arriba a la derecha.</span></li></ol><p class="install-browser-note">Si no aparece la opción, abre este enlace en Safari.</p>`:androidDevice()?`<ol class="install-steps"><li><span>Abre el menú <strong>⋮</strong>, arriba a la derecha de tu navegador.</span></li><li><span>Elige <strong>«Instalar app»</strong> o <strong>«Añadir a pantalla de inicio»</strong>.</span></li><li><span>Toca <strong>«Instalar»</strong> o <strong>«Añadir»</strong> para confirmar.</span></li></ol><p class="install-browser-note">Si no aparece la opción, abre este enlace en Chrome.</p>`:`<ol class="install-steps"><li><span>Abre el menú de tu navegador o busca el icono de instalación en la barra de direcciones.</span></li><li><span>Selecciona <strong>«Instalar Halitus AB7»</strong> o <strong>«Instalar aplicación»</strong>.</span></li><li><span>Confirma para abrir el programa desde tu escritorio.</span></li></ol><p class="install-browser-note">Si tu navegador no ofrece esta opción, utiliza Chrome o Edge.</p>`;document.querySelector('[data-install-native]').hidden=!direct;document.querySelector('[data-install-understood]').hidden=direct;installDialog.querySelector('.install-dialog-actions [data-install-later]').hidden=!direct;if(!installDialog.open)installDialog.showModal()}
function postponeInstallHint(){installState.postponements++;installState.nextPromptAt=Date.now()+(installState.postponements>=3?10:1)*24*60*60*1000;saveInstallState();if(installDialog.open)installDialog.close()}
function markInstalled(){installState.installed=true;installState.nextPromptAt=0;saveInstallState();installPrompt=null;if(installDialog.open)installDialog.close();document.querySelectorAll('[data-install-help]').forEach(button=>{button.disabled=true;if(button.classList.contains('header-install')){button.setAttribute('aria-label','Aplicación instalada');button.innerHTML=icon('phone')+'<span>Instalada</span>'}else button.innerHTML=icon('phone')+' Aplicación instalada'})}
installDialog.addEventListener('click',async e=>{if(e.target.closest('[data-install-later],[data-install-understood]'))postponeInstallHint();if(e.target.closest('[data-install-native]')&&androidChrome()&&installPrompt){const prompt=installPrompt;installPrompt=null;try{await prompt.prompt();const choice=await prompt.userChoice;if(choice.outcome==='accepted')markInstalled();else postponeInstallHint()}catch{showInstallHint();toast('Abre el menú del navegador y selecciona «Instalar app».')}}});
installDialog.addEventListener('cancel',e=>{e.preventDefault();postponeInstallHint()});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;if(installDialog.open)showInstallHint()});
window.addEventListener('appinstalled',markInstalled);
document.addEventListener('click',e=>{if(e.target.closest('[data-install-help]'))showInstallHint()});if(installedApp()){const b=document.querySelector('.header-install');b.disabled=true;b.setAttribute('aria-label','Aplicación instalada');b.innerHTML=icon('phone')+'<span>Instalada</span>'}
if((iosDevice()||androidDevice())&&!installedApp()&&Date.now()>=installState.nextPromptAt)setTimeout(()=>{if(!installedApp()&&Date.now()>=installState.nextPromptAt)showInstallHint()},3500);

entryScreen.querySelector('#code-form').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button[type=submit]');if(b.disabled)return;const email=entryScreen.querySelector('#code-email').value.trim().toLowerCase(),token=entryScreen.querySelector('#code-token').value.replace(/\D/g,'');if(token.length<6){authStatus('Escribe el código completo que recibiste por correo.',true);return}b.disabled=true;authStatus('Verificando tu código…');try{const {error}=await authClient.auth.verifyOtp({email,token,type:'recovery'});if(error){authStatus(error.status===429?'Demasiados intentos. Espera unos minutos.':'Código incorrecto o caducado. Usa el del correo más reciente o pide uno nuevo.',true);return}entryScreen.querySelector('#code-token').value='';codeMode=false;passwordMode=true;await bootstrapBuyer()}catch{authStatus('No se pudo conectar. Inténtalo nuevamente.',true)}finally{b.disabled=false}};
entryScreen.querySelector('[data-resend-code]').onclick=async e=>{const b=e.currentTarget,email=entryScreen.querySelector('#code-email').value.trim().toLowerCase();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){authStatus('Escribe el correo de tu compra.',true);return}b.disabled=true;try{const fail=await sendAccessCode(email);authStatus(fail||'Te enviamos un código nuevo. Usa solo el correo más reciente.',!!fail)}catch{authStatus('No se pudo conectar. Inténtalo nuevamente.',true)}finally{b.disabled=false}};
document.querySelector('#main').addEventListener('click',async e=>{if(!e.target.closest('[data-exit]'))return;await Promise.all([flushProgress(),flushPremium(),flushBuyerPreferences()]);const {error}=await authClient.auth.signOut({scope:'local'});if(error){toast('No se pudo cerrar la sesión. Inténtalo nuevamente.');return}passwordMode=false;history.replaceState(null,'',location.pathname+'#inicio');clearBuyer();if(installDialog.open)installDialog.close();entryScreen.querySelector('#entry-email').focus()});
authClient.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT')clearBuyer();if(event==='PASSWORD_RECOVERY')passwordMode=true;if(event==='PASSWORD_RECOVERY'||(event==='SIGNED_IN'&&(!entryAccepted||authUser?.id!==session?.user?.id||passwordMode)))setTimeout(()=>bootstrapBuyer(),0)});
async function recheckAccess(){if(!entryAccepted||!authUser)return;const {data,error}=await authClient.from('ab7_content').select('id');if(error)throw new Error('access_check_failed');if(!data?.length){clearBuyer('Tu acceso no está activo. Contacta con soporte.');return}const hasBase=data.some(c=>c.id==='program'),hasPremium=data.some(c=>c.id==='adaptacion');const expectedBonuses=BONUS_CATALOG.filter(b=>data.some(c=>c.id===b.scope)).map(b=>b.id).sort().join(','),currentBonuses=bonusMaterials.map(b=>b.id).sort().join(',');if(hasBase!==programAccess||hasPremium!==!!premiumContent||expectedBonuses!==currentBonuses){if(!hasBase){clearTimeout(progressTimer);progressDirty=false}if(!hasPremium){clearTimeout(premiumTimer);premiumDirty=false;premiumContent=null}stopReading();bonusMaterials=bonusMaterials.filter(b=>BONUS_CATALOG.some(c=>c.id===b.id&&data.some(d=>d.id===c.scope)));document.querySelector('#main').replaceChildren();await Promise.all([flushProgress(),flushPremium(),flushBuyerPreferences()]);await bootstrapBuyer()}}
setInterval(()=>recheckAccess().catch(()=>{}),300000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')recheckAccess().catch(()=>{});else if(entryAccepted){flushProgress();flushPremium();flushBuyerPreferences()}});
updateEntry();applyTheme();bootstrapBuyer();

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('./sw.js').catch(()=>{});
const modelContext=document.modelContext;
if(modelContext?.registerTool){
 const lifecycle=new AbortController();
 const tools=[{
 name:'read_ab7_progress',title:'Leer progreso AB7',description:'Leer módulos completados y registros diarios del dispositivo.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},execute(){if(!entryAccepted)throw Error('Inicia sesión');return {completed:[...state.completed],tasks:JSON.parse(JSON.stringify(state.tasks)),lastModule:state.lastModule}}
 },{
 name:'open_ab7_module',title:'Abrir módulo AB7',description:'Abrir uno de los siete módulos originales y guardar el punto de continuación.',inputSchema:{type:'object',properties:{id:{type:'integer',minimum:1,maximum:7}},required:['id'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(input){if(!entryAccepted)throw Error('Inicia sesión');if(!input||Object.keys(input).some(k=>k!=='id')||!Number.isInteger(input.id)||input.id<1||input.id>7)throw Error('Módulo inválido');location.hash='modulo/'+input.id;render();return {module:input.id,title:modules[input.id-1].title}}
 }];
 for(const tool of tools){try{Promise.resolve(modelContext.registerTool(tool,{signal:lifecycle.signal})).catch(()=>{})}catch{}}
 addEventListener('pagehide',()=>lifecycle.abort(),{once:true});
}
</script></body></html>
